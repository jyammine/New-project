name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: littlenest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/littlenest
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/littlenest_test
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SERVER_URL: http://localhost:3000
      MEDIA_DIR: ${{ github.workspace }}/media
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, types and formatting
        run: |
          pnpm lint
          pnpm typecheck
          pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE littlenest_test'
          pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Prepare database (migrations + demo content)
        env:
          NODE_ENV: production
        run: |
          pnpm migrate
          pnpm seed

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          CI: true
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
