# Render Blueprint — creates the shop, its Postgres database and storage for uploaded images.
# Deploy: https://render.com/deploy?repo=https://github.com/jyammine/New-project
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: little-nest
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Persistent disks need a paid instance; Starter is the smallest.
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: media
      mountPath: /app/media
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: little-nest-db
          property: connectionString
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: MEDIA_DIR
        value: /app/media
      # Your login for /admin, created on first start. Use a password of 12+ characters.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # Loads the demo products and pages into the empty shop. Safe to leave on: it only runs
      # while the shop has no products.
      - key: SEED_DEMO_CONTENT
        value: 'true'
      # The site address defaults to the onrender.com URL. Set SERVER_URL when you add your own
      # domain, and add Stripe and SMTP settings (see README) when you are ready to take orders.

databases:
  - name: little-nest-db
    databaseName: littlenest
    user: littlenest
    # No plan is set, so Render uses its default (smallest paid) Postgres instance.
    # (Render free databases expire after 30 days, so they suit short trials only.)
